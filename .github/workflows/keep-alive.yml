name: Keep services awake

# Render's free instances sleep after ~15 minutes of inactivity, and waking one
# adds roughly a minute to whatever the user was trying to do. Pinging /health
# keeps them warm and doubles as uptime monitoring: if a service does not answer,
# this job fails and GitHub emails you.
#
# NOTE ON COST: a warm service consumes Render free instance hours, which are
# limited per month and shared across your free services. Pinging three services
# around the clock will burn through that allowance well before month end, so
# this runs during a daytime window instead. Widen or narrow `schedule` below to
# match your allowance - the times are UTC (IST is UTC+5:30).
#
#   '*/10 4-12 * * *'  -> every 10 min, 09:30-18:29 IST  (~9h/day, current)
#   '*/10 3-17 * * *'  -> every 10 min, 08:30-23:29 IST  (~15h/day)
#   '*/10 * * * *'     -> every 10 min, around the clock (~24h/day)

on:
  schedule:
    - cron: '*/10 4-12 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every unhealthy service, not just the first
      matrix:
        service:
          - name: frontend
            url: https://job-sniff.onrender.com/health
          - name: backend
            url: https://job-sniff-backend.onrender.com/health
          - name: ai-service
            url: https://job-sniff-ai-service.onrender.com/health
    steps:
      - name: Ping ${{ matrix.service.name }}
        run: |
          # A sleeping instance can take ~60s to answer, so allow a long timeout
          # and retries before calling it down.
          code=$(curl --silent --show-error \
                      --max-time 150 \
                      --retry 3 --retry-delay 10 --retry-all-errors \
                      --write-out '%{http_code}' \
                      --output response.txt \
                      "${{ matrix.service.url }}") || true

          echo "HTTP $code"
          echo "$(cat response.txt 2>/dev/null | head -c 300)"

          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.service.name }} is unhealthy (HTTP ${code:-no response})"
            exit 1
          fi
          echo "${{ matrix.service.name }} is awake"
