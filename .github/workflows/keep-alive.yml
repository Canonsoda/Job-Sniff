name: Keep services awake

# Render's free instances sleep after ~15 minutes idle. Waking one shows
# Render's own "SERVICE WAKING UP" splash page - that screen belongs to Render's
# proxy, not to this app, so the only way to avoid it is for the service not to
# be asleep when someone arrives.
#
# Free instance hours are capped per month and shared across free services, so
# keeping all three warm around the clock would exhaust the allowance and get
# everything suspended. The allowance is spent where it shows:
#
#   frontend    pinged every 10 min, 24/7  - it is the page users land on, so
#                                            this is what removes the splash
#   backend     not pinged                 - wakes on the first API call
#   ai-service  not pinged                 - wakes on the first upload
#
# The cost is that the first dashboard load and first upload after an idle
# period are slower. No splash screen either way.
#
# Running this workflow by hand pings all three, so it doubles as an on-demand
# health check of the whole stack.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every unhealthy service, not just the first
      matrix:
        service:
          - name: frontend
            url: https://job-sniff.onrender.com/health
            keep_warm: true
          - name: backend
            url: https://job-sniff-backend.onrender.com/health
            keep_warm: false
          - name: ai-service
            url: https://job-sniff-ai-service.onrender.com/health
            keep_warm: false
    steps:
      - name: Ping ${{ matrix.service.name }}
        # Scheduled runs only keep the frontend warm; a manual run checks all three
        if: matrix.service.keep_warm || github.event_name == 'workflow_dispatch'
        run: |
          # A sleeping instance can take ~60s to answer, so allow a long timeout
          # and retries before calling it down.
          code=$(curl --silent --show-error \
                      --max-time 150 \
                      --retry 3 --retry-delay 10 --retry-all-errors \
                      --write-out '%{http_code}' \
                      --output response.txt \
                      "${{ matrix.service.url }}") || true

          echo "HTTP $code"
          echo "$(cat response.txt 2>/dev/null | head -c 300)"

          if [ "$code" != "200" ]; then
            echo "::error::${{ matrix.service.name }} is unhealthy (HTTP ${code:-no response})"
            exit 1
          fi
          echo "${{ matrix.service.name }} is awake"
