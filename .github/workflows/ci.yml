name: CI

# Runs on every push and pull request. Each service is a separate job so a
# frontend lint failure does not hide a backend test failure, and so the matrix
# of what is actually verified per service stays visible:
#
#   backend     unit tests (node:test, no DB required) + syntax check
#   frontend    eslint + a real production build
#   ai-service  dependency install + byte-compile
#
# There is no end-to-end job: that would need MongoDB, Elasticsearch and a live
# LLM key, so it is deliberately out of scope here.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      # Uses the Node built-in test runner, so there is no framework to install
      # and no MongoDB needed - User.findById is stubbed in the test.
      - name: Test
        run: npm test

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # The build is the real check: it catches bad imports and syntax errors
      # that lint alone lets through, and it is what Render runs on deploy.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api

  ai-service:
    name: AI service · compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv_llm_scoring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cv_llm_scoring/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # Byte-compiling catches syntax errors and, because the imports resolve
      # against the installed requirements, a missing dependency too.
      - name: Compile
        run: python -m compileall -q app.py process_resume.py

      - name: Import check
        run: python -c "import app, process_resume"
        env:
          OPENROUTER_API_KEY: not-a-real-key-ci-only
